# Domain events published by procurement.
# Naming: <module>.<entity>.<past-tense-verb>
# Every event carries: id, occurred_at, actor, tenant, version, payload.
# Amounts are decimal strings in rupees. line_id is the budget-grants budget or grant line.
module: procurement
version: 1
events:
  - name: procurement.indent.submitted
    description: notification tells the approver.
    payload: { organisation_id: uuid, indent_id: uuid, number: string, requested_by: uuid, department_id: uuid, estimated_cost: string }
  - name: procurement.indent.approved
    payload: { organisation_id: uuid, indent_id: uuid, number: string, requested_by: uuid, line_id: uuid, estimated_cost: string, purchase_method: string }
  - name: procurement.indent.rejected
    payload: { organisation_id: uuid, indent_id: uuid, number: string, requested_by: uuid, note: string }
  - name: procurement.tender.published
    payload: { organisation_id: uuid, tender_id: uuid, number: string, method: string, category: string, closes_at: datetime }
  - name: procurement.tender.awarded
    payload: { organisation_id: uuid, tender_id: uuid, vendor_id: uuid, quote_id: uuid, total: string }
  - name: procurement.purchase-order.issued
    description: budget-grants records a commitment of total on line_id. notification sends the order to the vendor.
    payload: { organisation_id: uuid, purchase_order_id: uuid, number: string, vendor_id: uuid, line_id: uuid, total: string, delivery_by: date, document_id: string }
  - name: procurement.purchase-order.cancelled
    description: >-
      Cancelled, or the undelivered remainder closed. budget-grants releases released_amount of the commitment on line_id.
    payload: { organisation_id: uuid, purchase_order_id: uuid, line_id: uuid, released_amount: string, reason: string }
  - name: procurement.goods-receipt.recorded
    description: Goods accepted. inventory-equipment or asset-management may add stock or register assets.
    payload: { organisation_id: uuid, goods_receipt_id: uuid, purchase_order_id: uuid, vendor_id: uuid, received_on: date, items: array }
  - name: procurement.vendor-invoice.approved
    payload: { organisation_id: uuid, vendor_invoice_id: uuid, purchase_order_id: uuid, vendor_id: uuid, amount: string }
  - name: procurement.vendor-invoice.paid
    description: budget-grants moves amount on line_id from committed to spent.
    payload: { organisation_id: uuid, vendor_invoice_id: uuid, purchase_order_id: uuid, vendor_id: uuid, line_id: uuid, amount: string, paid_on: date }
  - name: procurement.vendor.blacklisted
    payload: { organisation_id: uuid, vendor_id: uuid, reason: string }
