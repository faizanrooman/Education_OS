# Domain events published by budget-grants.
# Naming: <module>.<entity>.<past-tense-verb>
# Every event carries: id, occurred_at, actor, tenant, version, payload.
# Amounts are decimal strings in rupees.
module: budget-grants
version: 1
events:
  - name: budget-grants.budget.approved
    description: A budget's lines are open for spending.
    payload: { organisation_id: uuid, budget_id: uuid, financial_year: string, department_id: uuid, allocated_total: string }
  - name: budget-grants.reappropriation.approved
    payload: { organisation_id: uuid, reappropriation_id: uuid, from_line_id: uuid, to_line_id: uuid, amount: string }
  - name: budget-grants.line.threshold-reached
    description: >-
      Committed plus spent on a budget or grant line crossed a threshold (BUDGET_GRANTS_ALERT_PERCENTS).
      notification tells finance staff and, for grants, the investigators.
    payload: { organisation_id: uuid, line_id: uuid, kind: string, percent: integer, allocated: string, used: string }
  - name: budget-grants.grant.sanctioned
    payload: { organisation_id: uuid, grant_id: uuid, code: string, funder: string, sanctioned_amount: string, principal_investigator_id: uuid, start_date: date, end_date: date }
  - name: budget-grants.grant.funds-received
    payload: { organisation_id: uuid, grant_id: uuid, amount: string, received_on: date }
  - name: budget-grants.grant.closed
    payload: { organisation_id: uuid, grant_id: uuid, unspent: string, unspent_action: string }
  - name: budget-grants.utilisation-certificate.due
    description: Sent 30 and 7 days before a certificate is due. notification reminds the investigators and the research office.
    payload: { organisation_id: uuid, grant_id: uuid, due_on: date, days_left: integer }
  - name: budget-grants.utilisation-certificate.submitted
    payload: { organisation_id: uuid, certificate_id: uuid, grant_id: uuid, period_from: date, period_to: date, spent: string }
