[project]
name = "eos-core"
version = "0.1.0"
description = "Education OS core: settings, database, tenant context, security, config loaders, entitlement rule, outbox."
requires-python = ">=3.12"
dependencies = ["sqlalchemy>=2.0", "pyyaml>=6", "PyJWT>=2.8", "pydantic>=2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
