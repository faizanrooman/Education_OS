[project]
name = "eos-testing"
version = "0.1.0"
description = "Education OS test utilities: platform stubs, factories and the cross-tenant leak check."
requires-python = ">=3.12"
dependencies = ["eos-core", "httpx>=0.27", "pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
