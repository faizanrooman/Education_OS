# Python lint and format rules for every backend package. Always pass this file explicitly:
#   ruff check --config tools/config/ruff.toml .   and   ruff format --config tools/config/ruff.toml .
# Paths below are relative to the repo root (the working directory), per ruff's --config rules.
line-length = 120
cache-dir = ".venv/.ruff_cache"
target-version = "py312"
extend-exclude = [".venv", "node_modules", "dist"]

[lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "T20"]
ignore = ["S101", "S105", "S106", "B008", "E501"]
per-file-ignores = { "**/tests/**" = ["S", "T20"], "tools/**" = ["T20", "S603", "S607"], "packages/testing/**" = ["S"] }
