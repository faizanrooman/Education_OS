# Education OS web app served as static files by an existing nginx reverse proxy,
# on a dedicated port so it does not touch the other vhosts.
# Deployed by tools/scripts/deploy-web-static.sh.
server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /var/www/education-os;
    index index.html;

    access_log /var/log/nginx/education-os.access.log;
    error_log  /var/log/nginx/education-os.error.log;

    # Single-page app: unknown paths fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets are safe to cache for a long time
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
